<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1200" height="630" viewBox="0 0 1200 630" role="img"
     aria-labelledby="title description">
  <title id="title">Yoshinya OGP image template</title>
  <desc id="description">Reusable OGP template with an editable tool name.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#FFF2D4"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF795A"/>
      <stop offset="1" stop-color="#FF573A"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#08275F" flood-opacity=".16"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#08275F" flood-opacity=".10"/>
    </filter>
    <clipPath id="canvas">
      <rect width="1200" height="630" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#canvas)">
    <rect width="1200" height="630" fill="url(#background)"/>

    <!-- Brand decoration -->
    <circle cx="1090" cy="67" r="238" fill="#FF694E" opacity=".11"/>
    <circle cx="1090" cy="67" r="169" fill="#FF694E" opacity=".10"/>
    <path d="M-80 600 C210 525 411 690 724 600 C954 535 1090 510 1280 566 L1280 700 L-80 700 Z"
          fill="#08275F" opacity=".055"/>

    <!-- Header logo -->
    <image x="72" y="58" width="286" height="69"
           preserveAspectRatio="xMinYMid meet"
           xlink:href="assets/logo-yoshinya.png"/>

    <!-- Universal launch label -->
    <g filter="url(#soft-shadow)">
      <rect x="72" y="168" width="270" height="46" rx="23" fill="url(#accent)"/>
    </g>
    <text x="207" y="199" text-anchor="middle"
          font-family="'Noto Sans JP', Arial, sans-serif"
          font-size="18" font-weight="700" letter-spacing="2.5"
          fill="#FFFFFF">YOSHINYA WEB TOOL</text>

    <!--
      EDIT HERE:
      Replace the two tspan contents with the Japanese or English tool name.
      Keep one or two lines. Suggested font sizes:
      short: 68px / medium: 60px / long: 50px.
    -->
    <g id="editable-tool-name">
      <text x="72" y="320"
            font-family="'Noto Sans JP', Arial, sans-serif"
            font-size="60" font-weight="800" letter-spacing="-1.5"
            fill="#08275F">
        <tspan x="72" dy="0">Tool name</tspan>
        <tspan x="72" dy="82">goes here.</tspan>
      </text>
      <rect x="72" y="435" width="92" height="8" rx="4" fill="#FF694E"/>
      <rect x="174" y="435" width="34" height="8" rx="4" fill="#08275F" opacity=".22"/>
    </g>

    <text x="72" y="510"
          font-family="'Noto Sans JP', Arial, sans-serif"
          font-size="22" font-weight="700" letter-spacing="1.4"
          fill="#36517D">FREE • NO SIGN-UP • IN-BROWSER</text>

    <g transform="translate(72 548)">
      <circle cx="12" cy="12" r="12" fill="#FF694E"/>
      <path d="M7 12.5l3.2 3.2L17.5 8.5" fill="none" stroke="#FFFFFF"
            stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="20"
            font-family="'Noto Sans JP', Arial, sans-serif"
            font-size="24" font-weight="700" letter-spacing=".4"
            fill="#08275F">yoshinya.com</text>
    </g>

    <!-- Mascot -->
    <g>
      <ellipse cx="920" cy="536" rx="174" ry="19" fill="#08275F" opacity=".09"
               filter="url(#soft-shadow)"/>
      <image x="705" y="24" width="443" height="566"
             preserveAspectRatio="xMidYMid meet"
             xlink:href="assets/yoshinyan-wink.png"/>
    </g>

    <!-- Safe-area corner accent -->
    <path d="M1176 440v116c0 27-21 48-48 48h-86" fill="none"
          stroke="#FF694E" stroke-width="8" stroke-linecap="round" opacity=".55"/>
  </g>
</svg>
