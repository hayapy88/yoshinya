# Cross-engine end-to-end run.
#
# The reason this exists on CI rather than locally: Playwright ships no WebKit
# build for macOS 13, so Safari's engine cannot be exercised on the development
# machine at all. Linux runners can, and WebKit is the engine most likely to
# differ — the image compressor depends on OffscreenCanvas, module workers, and
# canvas WebP encoding, none of which arrived in Safari at the same time.
name: e2e (all browsers)

on:
  push:
    branches: [main]
  pull_request:
  # Cross-engine runs are slower than the everyday Chromium loop, so they can
  # also be started by hand without waiting for a push.
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # react-router v8 requires >= 22.22.
          node-version: '22.23.1'
          cache: npm

      - run: npm ci

      # --with-deps pulls the system libraries the Linux builds need; without
      # it WebKit installs but will not launch.
      - run: npx playwright install --with-deps chromium firefox webkit

      # Without this the repo drifts back: an editor that sees .prettierrc
      # formats whatever file someone opens, and the diff lands in an unrelated
      # commit. That is what happened before the formatting was applied.
      - run: npm run format:check

      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

      # ALL_BROWSERS adds the firefox and webkit projects, which the config
      # otherwise omits so the local suite does not fail on the missing macOS
      # WebKit build. CI forces a fresh preview server rather than reusing one.
      - run: npx playwright test
        env:
          ALL_BROWSERS: '1'
          CI: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          retention-days: 7
